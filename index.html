<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carreira Brasileirão</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carreira BR">

<style>
:root{--bg:#0d1b14;--card:#16291f;--tx:#eef5f0;--mu:#8fa89a;--ac:#2ecc71;--bd:#24402f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:12px 12px 84px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
h2{margin:0 0 8px;font-size:18px}h3{margin:0 0 6px;font-size:15px;color:var(--mu)}
button{font:inherit;color:var(--tx);background:#1f3a2b;border:1px solid var(--bd);border-radius:12px;padding:14px;min-height:48px;width:100%;margin-top:8px}
button.p{background:var(--ac);color:#04200f;font-weight:700;border:0}
button.s{width:auto;min-width:48px;margin:3px;padding:8px 12px;min-height:44px}
button.on{outline:3px solid var(--ac)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:800}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:2px solid #fff3}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 3px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}
tr.me{background:#2ecc7133;font-weight:700}tr{border-bottom:1px solid var(--bd)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0a1510;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border:0;border-radius:0;background:none;padding:14px 2px;font-size:13px}nav button.on{color:var(--ac);outline:0;font-weight:700}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#0d1b14;color:var(--tx)}
.log{font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.badge{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px;border:1px solid #fff5}

.card{box-shadow:0 2px 10px #0005;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
button{transition:transform .08s,filter .15s}button:active:not(:disabled){transform:scale(.97);filter:brightness(1.2)}
button:disabled{opacity:.45}
button.p{box-shadow:0 3px 12px #2ecc7144}
.pb{height:8px;background:#0006;border-radius:6px;overflow:hidden;margin:6px 0}.pb>i{display:block;height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);border-radius:6px;transition:width .4s}
.log.gl{background:#2ecc7126;border-left:3px solid var(--ac);padding-left:8px;font-weight:700;animation:pop .4s ease both}
.log.bd{color:#ff8a80}
.rt{animation:pop .5s ease both}
.pitch{background:repeating-linear-gradient(90deg,#1c5a34 0 40px,#1f6439 40px 80px);border-radius:10px;padding:10px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Edição aprimorada: visual, leitura e usabilidade ===== */
:root{
  --bg:#07110d;--card:#101f17;--tx:#f3faf5;--mu:#a0b9aa;--ac:#35e782;
  --bd:#284735;--gold:#ffd166;--danger:#ff7272;
}
html{
  background:
    radial-gradient(ellipse at 12% -8%,rgba(53,231,130,.13),transparent 38%),
    radial-gradient(ellipse at 100% 30%,rgba(39,112,72,.12),transparent 34%),
    var(--bg);
  min-height:100%;
}
body{background:transparent;line-height:1.45;letter-spacing:.01em}
#app{max-width:760px;padding:18px 14px 110px}
#app>h2{
  font-size:clamp(22px,5vw,30px);letter-spacing:-.04em;margin:4px 2px 16px;
  display:flex;align-items:center;gap:9px;
}
#app>h2:before{
  content:"";display:inline-block;width:8px;height:29px;border-radius:9px;
  background:linear-gradient(180deg,#6dffac,var(--ac));box-shadow:0 0 20px #35e78255;
}
.card{
  background:linear-gradient(145deg,rgba(22,43,31,.97),rgba(13,29,21,.98));
  border:1px solid rgba(117,177,137,.19);border-radius:18px;
  padding:15px;margin-bottom:12px;box-shadow:0 8px 26px #0003;
}
.card h2{font-size:19px;letter-spacing:-.025em}
.card h3{font-size:13px;letter-spacing:.075em;text-transform:uppercase;color:#a9c8b5}
.big{font-size:clamp(21px,5vw,27px);letter-spacing:-.035em}
.mu{line-height:1.5;color:#9bb5a5}
button{
  border:1px solid #345943;background:linear-gradient(180deg,#1c3c2a,#173323);
  border-radius:13px;padding:12px 14px;min-height:46px;font-weight:600;
  box-shadow:0 3px 10px #0002;
}
button.p{
  background:linear-gradient(135deg,#4af39a,#24c96d);color:#052414;
  box-shadow:0 5px 18px #2ecc7140;font-weight:800;
}
button.s{box-shadow:none}
button.on{outline:2px solid var(--ac);outline-offset:1px}
button:focus-visible,input:focus-visible{outline:3px solid #67f6a6;outline-offset:2px}
input{border-radius:12px;background:#09150e;border-color:#345943}
nav{
  background:rgba(5,15,10,.94);backdrop-filter:blur(18px);
  border-top:1px solid #315440;padding:5px 4px env(safe-area-inset-bottom,0px);
  box-shadow:0 -8px 30px #0003;z-index:50;
}
nav button{font-size:12px;min-height:54px;font-weight:600;color:#9bb5a5}
nav button.on{color:var(--ac);background:linear-gradient(180deg,#2ecc7115,transparent)}
table{font-size:13px;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:10px}
th{color:#a8c7b4;font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:#09160f;padding:10px 5px}
td{padding:9px 5px;border-bottom:1px solid #294333}
tr:last-child td{border-bottom:0}
tr.me{background:linear-gradient(90deg,#2ecc7128,#2ecc710a);color:#fff}
tr.me td:first-child{box-shadow:inset 3px 0 var(--ac)}
.badge{width:10px;height:10px;border:1px solid #ffffff66}
.pb{height:9px;background:#050b07;border:1px solid #294333}
.pb>i{background:linear-gradient(90deg,#20b965,#69ffab)}
.log{padding:8px 2px;border-bottom-color:#294333;line-height:1.4}
.log.gl{border-radius:7px;padding:8px;margin:3px 0}
.pitch{border:1px solid #4c9866;box-shadow:inset 0 0 0 1px #ffffff0b;background:repeating-linear-gradient(90deg,#15502d 0 40px,#195a33 40px 80px)}
.row{gap:12px}
@media(min-width:600px){
  #app{padding:24px 20px 110px}
  #app .card{padding:18px}
  nav{left:50%;right:auto;transform:translateX(-50%);width:min(760px,100%);border:1px solid #315440;border-bottom:0;border-radius:18px 18px 0 0}
  nav button{font-size:13px}
}
@media(max-width:380px){
  #app{padding:12px 9px 100px}
  .card{padding:12px;border-radius:15px}
  td,th{padding:7px 2px;font-size:12px}
  nav button{font-size:11px;padding-inline:0}
}
@media(hover:hover){button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}}
input[type="search"]{appearance:none}
input[type="search"]::-webkit-search-cancel-button{cursor:pointer}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}


/* Copa: navegação por categorias para reduzir a poluição visual */
.cup-intro .cup-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.cup-summary>div{padding:12px;border-radius:12px;background:#07150d;border:1px solid #31543e;min-width:0}
.cup-summary b,.cup-summary span{display:block;overflow-wrap:anywhere}
.cup-summary b{font-size:14px;color:#6dffac}
.cup-summary span{font-size:11px;color:var(--mu);margin-top:4px}
.cup-section{border:1px solid #315440;border-radius:16px;margin:0 0 12px;overflow:hidden;background:rgba(12,29,20,.88);box-shadow:0 6px 18px #0002}
.cup-section>summary{cursor:pointer;list-style:none;padding:16px 14px;font-weight:800;font-size:15px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(110deg,#193b29,#102319);min-height:60px}
.cup-section>summary::-webkit-details-marker,.cup-subsection>summary::-webkit-details-marker{display:none}
.cup-section>summary:after{content:"＋";float:right;color:var(--ac);font-size:18px;align-self:flex-end;margin-top:-26px}
.cup-section[open]>summary:after{content:"−"}
.cup-section>summary span{font-size:11px;font-weight:500;color:var(--mu);letter-spacing:0}
.cup-content{padding:10px 10px 2px}
.cup-content>.card{margin-bottom:10px}
.cup-subsection{margin:8px 0 12px;border:1px solid #2b4b37;border-radius:12px;overflow:hidden}
.cup-subsection>summary{cursor:pointer;padding:12px;background:#0a190f;font-weight:700;font-size:13px;list-style:none}
.cup-subsection>summary:before{content:"▸";color:var(--ac);margin-right:8px}
.cup-subsection[open]>summary:before{content:"▾"}
.cup-subsection>.card{margin:0;border:0;border-radius:0;box-shadow:none}
@media(max-width:420px){.cup-section>summary{font-size:14px;padding:14px 12px}.cup-content{padding:8px 7px 1px}}

/* ===== Competições europeias jogáveis (Champions, Liga Europa, Conference) para clubes de Portugal ===== */
(function(){

    round=round.map(([a,b])=>{let h=hc[a]<hc[b]?a:hc[b]<hc[a]?b:(Math.random()<.5?a:b),v=h===a?b:a;hc[h]++;met[a].add(b);met[b].add(a);return[h,v]});

}
function euField(k,pq){

  let ids=[];const add=i=>{if(i!=null&&!ids.includes(i))ids.push(i)};
  const PTL=EUR2_L.find(L=>L.k==="pt"),n=PTL[k];
  let cand=(pq||[]).slice(0,n);

  if(cand.length<n)S.pt.clubs.slice().sort((a,b)=>TEAMS[b][1]-TEAMS[a][1]).forEach(i=>{if(cand.length<n&&!cand.includes(i))cand.push(i)});
  cand.forEach(add);

    names.forEach(nm=>add(mdId(clubDef(nm))));
  });

}
function euMk(k){

  t.forEach(i=>Pt[i]={p:0,gd:0,gf:0,j:0});

}
function euPairs(){

function euAfterLeague(){
  let e=S.eu,m=S.team,rk=euRank(e);e.rk=rk;e.top=rk.slice(0,8);

}
function euRes(my){
  let e=S.eu,m=S.team,p=e.ph,ps=euPairs();

    let mine=my&&(h==m||aw==m),x,y;
    if(mine){x=my[0];y=my[1]}else{[x,y]=sim(h,aw)}

    if(p<8){let A=e.P[h],B=e.P[aw];A.j++;B.j++;A.gf+=x;B.gf+=y;A.gd+=x-y;B.gd+=y-x;A.p+=x>y?3:x==y?1:0;B.p+=y>x?3:x==y?1:0;return}

  }
}
function euEv(){
  let e=S&&S.eu;if(!e||e.done||S.dv!=="PT")return null;

}
function euFinishAll(){let g=0;while(S.eu&&!S.eu.done&&g++<20)euRes(null)}
function euFin(x,y,mine,th,me,op){

}
function euSetup(){

    if(!k)return;

    S.log=S.log.slice(0,15);
  }catch(err){console.error(err);S.eu=null}
}
function euQual(){
  let o=order(),c=S.pt&&S.pt.cup,cc=c?c.champ:null,u=o.slice(0,3),e=[],r=o.slice(3);

}
function euCard(){

  hist=H.length?`<details class="cup-subsection"><summary>Campeões anteriores</summary><div class="card">${H.map(z=>`<div class="log">${z.y} · ${EU_IC[z.k]} ${EU_NM[z.k]}: ${TEAMS[z.c][0]} (vice ${TEAMS[z.ru][0]})</div>`).join("")}</div></details>`:"";

  let rk=e.ph>7&&e.rk?e.rk:euRank(e),nx=e.done?"Encerrada · campeão: <b>"+TEAMS[e.champ][0]+"</b>":"Próxima fase: <b>"+euLbl(e.ph)+"</b> (a partir da rodada "+EU_AT[e.ph]+" da liga)";
  let ties=e.ph>=8&&!e.done&&e.ties&&e.ties.length?`<h3>Confrontos atuais</h3>${e.ties.map(t=>`<div class="log">${TEAMS[t.a][0]} x ${TEAMS[t.b][0]}${t.ga!=null?" · ida: "+TEAMS[t.b][0]+" "+t.gb+"x"+t.ga+" "+TEAMS[t.a][0]:""}</div>`).join("")}`:"";
  return `<details class="cup-section" open><summary>${EU_IC[e.k]} ${e.nm} ${e.y} <span>• Sua campanha: ${e.res}</span></summary><div class="cup-content"><div class="card"><h2>${EU_IC[e.k]} ${e.nm} ${e.y}</h2><p>Sua campanha: <b>${e.res}</b></p><div class="mu">${nx}</div><div class="mu" style="margin-top:6px">36 clubes · fase de liga com 8 jogos contra adversários diferentes · 1º ao 8º vão direto às oitavas · 9º ao 24º disputam o playoff · playoff, oitavas, quartas e semifinais em ida e volta · final em jogo único.</div><table><tr><th>#</th><th>Clube</th><th>P</th><th>SG</th><th>J</th></tr>${rk.map((i,n)=>`<tr class="${i==S.team?"me":""}"><td>${n+1}</td><td>${TEAMS[i][0]}${n<8?" 🟢":n<24?" 🟡":""}</td><td>${e.P[i].p}</td><td>${e.P[i].gd}</td><td>${e.P[i].j}</td></tr>`).join("")}</table>${ties}</div><details class="cup-subsection"><summary>Resultados</summary><div class="card">${e.log.slice().reverse().slice(0,40).map(x=>`<div class="log">${x}</div>`).join("")||'<span class="mu">Nenhum jogo ainda</span>'}</div></details>${hist}</div></details>`;
}
window.euQual=euQual;window.euFin=euFin;window.euSetup=euSetup;window.euCard=euCard;

const _nextEvEU=nextEv;
nextEv=function(){
  if(S&&S.dv==="PT"&&S.eu&&!(S.pend&&S.pend.length)){let v=euEv();if(v)return v}
  return _nextEvEU();
};
const _endSeasonEU=endSeason;
endSeason=function(){
  let first=!S.sum,e=S.eu;
  if(first&&e&&!e.done&&S.dv==="PT"){try{euFinishAll()}catch(x){console.error(x)}}
  _endSeasonEU();
  if(first&&e&&S.sum&&!S.sum.eu){
    try{
      S.sum.eu=e.res;S.sum.eun=e.nm;S.sum.eui=EU_IC[e.k];
      let h=S.hist[S.hist.length-1];if(h){h.eu=e.res;h.eun=e.nm}
      save();
    }catch(x){console.error(x)}
  }
};
const _sumVEU=sumV;
sumV=function(){
  _sumVEU();
  try{
    let s=S.sum;
    if(s&&s.eu){let ap=$("app");ap.innerHTML=ap.innerHTML.replace("<p>⚽ ","<p>"+s.eui+" "+s.eun+": <b>"+s.eu+"</b></p><p>⚽ ")}
  }catch(x){console.error(x)}
};
const _trophyEU=trophyCard;
trophyCard=function(){
  let base=_trophyEU(),h=S.hist||[];
  let L=[["⭐ Champions League","Champions League"],["🟠 Liga Europa","Liga Europa"],["🟢 Conference League","Conference League"]].map(([n,k])=>[n,h.filter(x=>x.eun===k&&(x.eu||"").includes("Campeão"))]).filter(a=>a[1].length);
  if(!L.length)return base;
  return base.replace('<span class="mu">Ainda sem troféus. Bora ganhar o primeiro!</span>',"").replace(/<\/div>$/,L.map(([n,a])=>`<div class="log">${n}: <b>${a.length}</b><div class="mu">${a.map(x=>x.y).join(", ")}</div></div>`).join("")+"</div>");
};
const _eurSeasonEU=eurSeason;
eurSeason=function(){
  _eurSeasonEU();
  try{
    let c=S&&S.euChamp,E=S&&S.eur;
    if(c&&E&&E.y===c.y){
      if(E[c.k]){E[c.k].c=c.c;E[c.k].ru=c.ru}
      let h=E.h&&E.h[E.h.length-1];
      if(h&&h.y===c.y){if(c.k==="ucl")h.c=c.c;else h[c.k]=c.c}
    }
  }catch(x){}
};
const _goEU=go;
go=function(t){
  let r=_goEU(t);
  try{
    if(t==="cup"&&S&&S.dv==="PT"){let ap=$("app");if(ap)ap.innerHTML=euCard()+ap.innerHTML}
  }catch(x){console.error(x)}
  return r;
};
})();

window.addEventListener("error", function(event){
  try {
    const app = document.getElementById("app");
    if (app && (!app.innerHTML || !app.innerHTML.trim())) {
      app.innerHTML = '<div class="card" style="margin:20px;padding:20px"><h2>⚽ Carreira Brasileirão</h2><p>O jogo encontrou um erro ao carregar.</p><button class="p" onclick="location.reload()">Recarregar jogo</button><p class="mu">Se continuar, envie uma foto desta tela.</p></div>';
    }
  } catch(ignore) {}
});
