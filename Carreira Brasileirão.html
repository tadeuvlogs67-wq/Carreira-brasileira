<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carreira Brasileirão</title>
<style>
:root{--bg:#0d1b14;--card:#16291f;--tx:#eef5f0;--mu:#8fa89a;--ac:#2ecc71;--bd:#24402f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:12px 12px 84px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
h2{margin:0 0 8px;font-size:18px}h3{margin:0 0 6px;font-size:15px;color:var(--mu)}
button{font:inherit;color:var(--tx);background:#1f3a2b;border:1px solid var(--bd);border-radius:12px;padding:14px;min-height:48px;width:100%;margin-top:8px}
button.p{background:var(--ac);color:#04200f;font-weight:700;border:0}
button.s{width:auto;min-width:48px;margin:3px;padding:8px 12px;min-height:44px}
button.on{outline:3px solid var(--ac)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:800}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:2px solid #fff3}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 3px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}
tr.me{background:#2ecc7133;font-weight:700}tr{border-bottom:1px solid var(--bd)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0a1510;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border:0;border-radius:0;background:none;padding:14px 2px;font-size:13px}nav button.on{color:var(--ac);outline:0;font-weight:700}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#0d1b14;color:var(--tx)}
.log{font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.badge{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px;border:1px solid #fff5}
</style></head><body><div id="app"></div><div id="nv"></div>
<script>
const TEAMS=[["Flamengo",82,"#c8102e","#111"],["Palmeiras",82,"#006437","#fff"],["Cruzeiro",78,"#1b4fa0","#fff"],["Botafogo",77,"#111","#fff"],["Fluminense",74,"#7a0f2e","#0a7a3c"],["Bahia",75,"#1b4fa0","#d22"],["São Paulo",74,"#d22","#fff"],["Grêmio",73,"#2a8fd8","#111"],["Atlético-MG",75,"#111","#fff"],["Corinthians",73,"#111","#fff"],["Internacional",73,"#d00","#fff"],["Bragantino",71,"#fff","#d00"],["Santos",70,"#fff","#111"],["Vasco",71,"#111","#fff"],["Mirassol",68,"#f2c400","#0a7a3c"],["Vitória",67,"#d00","#111"],["Athletico-PR",70,"#c00","#111"],["Coritiba",66,"#0a7a3c","#fff"],["Chapecoense",64,"#0a7a3c","#fff"],["Remo",63,"#1b3a8a","#fff"],["Brasil",85,"#f2c400","#0a7a3c"],["Argentina",85,"#75aadb","#fff"],["França",86,"#1b3a8a","#fff"],["Espanha",85,"#c00","#f2c400"],["Inglaterra",83,"#fff","#c00"],["Alemanha",80,"#fff","#111"],["Portugal",82,"#c00","#0a7a3c"],["Holanda",80,"#f08000","#fff"],["Uruguai",77,"#75aadb","#111"],["Colômbia",77,"#f2c400","#1b3a8a"],["Croácia",76,"#fff","#c00"],["Japão",74,"#1b3a8a","#fff"],["Marrocos",76,"#c00","#0a7a3c"],["EUA",72,"#fff","#1b3a8a"],["México",73,"#0a7a3c","#fff"],["Senegal",72,"#0a7a3c","#f2c400"],["River Plate",80,"#fff","#c00"],["Boca Juniors",77,"#1b3a8a","#f2c400"],["Racing",74,"#75aadb","#fff"],["Estudiantes",74,"#c00","#fff"],["Peñarol",73,"#f2c400","#111"],["Nacional-URU",72,"#fff","#1b3a8a"],["Atlético Nacional",73,"#0a7a3c","#fff"],["Junior",68,"#c00","#fff"],["Colo-Colo",70,"#fff","#111"],["U. Católica",66,"#1b3a8a","#fff"],["LDU Quito",69,"#fff","#1b3a8a"],["Barcelona SC",66,"#f2c400","#111"],["Olimpia",67,"#fff","#111"],["Cerro Porteño",66,"#1b3a8a","#c00"],["Bolívar",65,"#75aadb","#fff"],["Universitario",68,"#f5e6b0","#c00"]];
const CUP=["Oitavas","Quartas","Semifinal","Final"],CAT=[5,12,20,29],LAT=[2,8,14,22,26,32],LN=["Quartas","Semifinal","Final"];
const SK=["#f1c9a5","#d9a066","#a8703f","#6b4226"],HC=["#111","#5a3418","#d8b04a","#b03a2e"],BC=["#f5f5f5","#111","#f2c400","#2a8fd8"];
const SIT=["A bola sobra na entrada da área","Você recebe de frente para o zagueiro","Contra-ataque rápido, espaço livre","Escanteio cobrado, bola nos seus pés","Troca de passes e o espaço abre"];
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
let S=null,L={sk:0,hs:0,hc:0,bt:0,name:"",pos:"ATA"},tab="home",M=null;
const save=()=>{try{localStorage.setItem("cb1",JSON.stringify(S))}catch(e){}};
try{S=JSON.parse(localStorage.getItem("cb1"))}catch(e){}
if(S&&!S.sel){S.sel={caps:0,g:0,a:0,wc:[]};S.pend=[]}
if(S&&!S.lib)S.lib=mkLib();
function pois(l){let e=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>e);return k-1}
const lam=(a,b,h)=>Math.min(3,1.25*Math.pow(1.045,TEAMS[a][1]-TEAMS[b][1])*(h?1.12:.95));
const sim=(a,b)=>[pois(lam(a,b,1)),pois(lam(b,a,0))];
function av(l,sz,c1,c2){let h=l.hs,H=HC[l.hc];
return `<svg width="${sz}" height="${sz*1.2}" viewBox="0 0 100 120">${h==1?`<rect x="26" y="26" width="48" height="56" rx="20" fill="${H}"/>`:""}${h==2?`<circle cx="50" cy="34" r="31" fill="${H}"/>`:""}<path d="M22 120q0-48 28-48t28 48z" fill="${c1}"/><path d="M40 74l10 12 10-12" fill="none" stroke="${c2}" stroke-width="4"/><circle cx="50" cy="42" r="22" fill="${SK[l.sk]}"/>${h!=3?`<path d="M28 40a22 22 0 0 1 44 0q-22-12-44 0z" fill="${H}"/>`:`<rect x="45" y="12" width="10" height="26" rx="4" fill="${H}"/>`}<circle cx="42" cy="44" r="2.5" fill="#111"/><circle cx="58" cy="44" r="2.5" fill="#111"/><path d="M43 53q7 5 14 0" stroke="#111" stroke-width="2" fill="none"/><rect x="30" y="112" width="16" height="8" rx="4" fill="${BC[l.bt]}"/><rect x="54" y="112" width="16" height="8" rx="4" fill="${BC[l.bt]}"/></svg>`}
function setup(){
const opt=(k,arr,sw)=>arr.map((c,i)=>sw?`<button class="s sw ${L[k]==i?"on":""}" style="background:${c}" onclick="L.${k}=${i};setup()"></button>`:`<button class="s ${L[k]==i?"on":""}" onclick="L.${k}=${i};setup()">${i+1}</button>`).join("");
$("nv").innerHTML="";
$("app").innerHTML=`<h2>⚽ Carreira Brasileirão</h2><div class="card" style="text-align:center">${av(L,120,"#2ecc71","#fff")}</div>
<div class="card"><input id="nm" placeholder="Nome do jogador" maxlength="18" value="${L.name}" oninput="L.name=this.value">
<h3 style="margin-top:12px">Pele</h3>${opt("sk",SK,1)}<h3>Estilo de cabelo</h3>${opt("hs",[0,1,2,3])}<h3>Cor do cabelo</h3>${opt("hc",HC,1)}<h3>Cor da chuteira</h3>${opt("bt",BC,1)}
<h3>Posição</h3>${["ATA","MEI"].map(p=>`<button class="s ${L.pos==p?"on":""}" onclick="L.pos='${p}';setup()">${p=="ATA"?"Atacante":"Meia"}</button>`).join("")}</div>
<button class="p" onclick="newGame()">Começar carreira</button>${S?`<button onclick="go('home')">Continuar carreira salva</button>`:""}`}
function newGame(){let n=(L.name||"").trim()||"Craque";
S={L:{...L},name:n,pos:L.pos,ovr:62,age:18,team:R(0,19),season:2026,hist:[],tot:{g:0,a:0,apps:0},log:[],sel:{caps:0,g:0,a:0,wc:[]},pend:[]};
newSeason();S.log.unshift(`${n} assinou com o ${TEAMS[S.team][0]}!`);save();go("home")}
function newSeason(){let o=sh([...Array(20).keys()]),t=[...o],B=[];
for(let r=0;r<19;r++){let m=[];for(let i=0;i<10;i++){let a=t[i],b=t[19-i];m.push(r%2?[b,a]:[a,b])}B.push(m);t.splice(1,0,t.pop())}
S.fix=B.concat(B.map(r=>r.map(([a,b])=>[b,a])));
S.T=TEAMS.map(()=>({p:0,j:0,v:0,e:0,d:0,gp:0,gc:0}));S.r=0;S.sum=null;S.offers=null;S.wc=0;S.pend=[];S.wcs=null;S.inj=null;
S.st={apps:0,g:0,a:0,rs:[]};S.lib=mkLib();if(S.lib.q.includes(S.team))S.log.unshift("🌎 Seu time está na Libertadores "+S.season+"!");
S.cup={alive:sh([...Array(20).keys()].filter(i=>i!=S.team)).slice(0,15).concat(S.team),ph:0,pairs:null,res:"Não classificado",log:[]}}
function app(a,b,x,y){let A=S.T[a],B=S.T[b];A.j++;B.j++;A.gp+=x;A.gc+=y;B.gp+=y;B.gc+=x;
if(x>y){A.v++;A.p+=3;B.d++}else if(x<y){B.v++;B.p+=3;A.d++}else{A.e++;B.e++;A.p++;B.p++}}
const order=()=>[...Array(20).keys()].sort((a,b)=>S.T[b].p-S.T[a].p||(S.T[b].gp-S.T[b].gc)-(S.T[a].gp-S.T[a].gc)||S.T[b].gp-S.T[a].gp);
function pairs(){let c=S.cup;if(!c.pairs){let al=sh(c.alive.filter(x=>x!=S.team)),p=[];if(c.alive.includes(S.team))al.unshift(S.team);
for(let i=0;i<al.length;i+=2)p.push(Math.random()<.5?[al[i],al[i+1]]:[al[i+1],al[i]]);c.pairs=p}return c.pairs}
function nextEv(){if(S.pend&&S.pend.length)return S.pend[0];if(S.r>=38){if(S.season%4==2&&!S.wc){S.wc=1;callUp(1);if(S.pend.length)return S.pend[0]}return{end:1}}let lv=libEv();if(lv)return lv;let c=S.cup;
if(c.ph<4&&S.r===CAT[c.ph]){if(c.alive.includes(S.team)){let p=pairs().find(q=>q.includes(S.team));return{cup:1,home:p[0],away:p[1]}}
simCup(null)}
let m=S.fix[S.r].find(q=>q.includes(S.team));return{home:m[0],away:m[1]}}
function pen(a,b){return Math.random()<.5+(TEAMS[a][1]-TEAMS[b][1])*.01?a:b}
const rnt=()=>sh([...Array(15).keys()].map(i=>i+21));
function retire(){if(!S.sum&&S.st.apps>0)S.hist.push({y:S.season,t:TEAMS[S.team][0],pos:order().indexOf(S.team)+1,g:S.st.g,a:S.st.a,n:Math.round(avg(S.st.rs)*10)/10,cup:S.cup.res,lib:S.lib.res});S.ret=1;save();go("ret")}
function newCareer(){try{localStorage.removeItem("cb1")}catch(e){}S=null;setup()}
function retV(){$("nv").innerHTML="";let h=S.hist,c=f=>h.filter(f).length,ts=[...new Set(h.map(x=>x.t))];
$("app").innerHTML=`<div class="card" style="text-align:center">${av(S.L,110,TEAMS[S.team][2],TEAMS[S.team][3])}<h2>🏁 ${S.name} se aposentou</h2><div class="mu">aos ${S.age} anos · ${h.length} temporada(s) · último clube: ${TEAMS[S.team][0]}</div></div>
<div class="card"><h3>Números da carreira</h3><p>${S.tot.apps} jogos · ${S.tot.g} gols · ${S.tot.a} assistências</p><p>🇧🇷 Seleção: ${S.sel.caps} jogos · ${S.sel.g} gols</p><p>Overall final: ${S.ovr}</p></div>
<div class="card"><h3>Títulos</h3><p>🏆 Brasileirão: ${c(x=>x.pos==1)}</p><p>🏆 Copa do Brasil: ${c(x=>(x.cup||"").includes("Campeão"))}</p><p>🌎 Libertadores: ${c(x=>(x.lib||"").includes("Campeão"))}</p><p>🌍 Copa do Mundo: ${S.sel.wc.filter(x=>x.includes("Campeão")).length}</p></div>
<div class="card"><h3>Clubes</h3><div>${ts.join(" · ")||"-"}</div></div>
<button class="p" onclick="newCareer()">Nova carreira</button>`}
function hurt(){let r=Math.random(),s=r<.6?0:r<.9?1:2,N=[["Pancada na coxa","Cãibra forte"],["Lesão muscular","Entorse no tornozelo"],["Ruptura de ligamento","Fratura no pé"]];S.inj={n:[R(1,2),R(3,5),R(6,12)][s],t:N[s][R(0,1)]};return S.inj}
function mkLib(){let q=S.qual||[0,1,2,3],f=sh([...Array(16).keys()].map(i=>i+36)).slice(0,12),t=sh(q.concat(f)),g=[0,1,2,3].map(i=>t.slice(i*4,i*4+4)),P={};t.forEach(i=>P[i]={p:0,gd:0,gf:0});
return{q,t,g,P,lp:0,al:null,pairs:null,res:q.includes(S.team)?"Fase de grupos":"Não classificado",log:[]}}
function libPairs(){let b=S.lib;if(!b.pairs){b.pairs=[];if(b.lp<3){let md=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]][b.lp];b.g.forEach(g=>md.forEach(([i,j])=>b.pairs.push(Math.random()<.5?[g[i],g[j]]:[g[j],g[i]])))}
else{let al=sh(b.al);if(al.includes(S.team)){al=al.filter(x=>x!=S.team);al.unshift(S.team)}for(let i=0;i<al.length;i+=2)b.pairs.push([al[i],al[i+1]])}}return b.pairs}
function libEv(){let b=S.lib;while(b.lp<6&&S.r>=LAT[b.lp]){let m=libPairs().find(q=>q.includes(S.team));if(m)return{lib:1,home:m[0],away:m[1],lbl:"Libertadores · "+(b.lp<3?"Grupos "+(b.lp+1)+"/3":LN[b.lp-3])};libRes(null)}return null}
const gs=b=>(x,y)=>b.P[y].p-b.P[x].p||b.P[y].gd-b.P[x].gd||b.P[y].gf-b.P[x].gf;
function libRes(my){let b=S.lib,w=[],g=b.lp<3,m=S.team;
libPairs().forEach(([a,c])=>{let x,y,win;
if(my&&(a==m||c==m)){[x,y,win]=my}else{[x,y]=sim(a,c);win=x>y?a:y>x?c:g?0:pen(a,c)}
b.log.push((g?"Grupos":LN[b.lp-3])+": "+TEAMS[a][0]+" "+x+"x"+y+" "+TEAMS[c][0]);
if(g){let A=b.P[a],B=b.P[c];A.gf+=x;B.gf+=y;A.gd+=x-y;B.gd+=y-x;A.p+=x>y?3:x==y?1:0;B.p+=y>x?3:x==y?1:0}
else{w.push(win);if(a==m||c==m)b.res=win!=m?(b.lp==5?"Vice-campeão da Libertadores":"Eliminado ("+LN[b.lp-3]+")"):b.lp==5?"Campeão da Libertadores 🏆":"Ainda na disputa"}});
if(g){if(b.lp==2){b.al=[];b.g.forEach(q=>b.al.push(...q.slice().sort(gs(b)).slice(0,2)));if(b.t.includes(m))b.res=b.al.includes(m)?"Ainda na disputa":"Eliminado (fase de grupos)"}}
else b.al=w;b.lp++;b.pairs=null}
function ko(ph){return{nt:1,wc:1,ph,home:20,away:rnt()[0],lbl:"Copa do Mundo · "+CUP[ph]}}
function callUp(wc){let s=S.st,a=avg(s.rs);if(s.apps<4||S.inj)return;if(S.ovr+(a-6.5)*8+s.g*.15<(wc?74:70))return;let o=rnt();
if(wc){S.pend=[0,1,2].map(i=>({nt:1,wc:1,g:1,home:20,away:o[i],lbl:"Copa do Mundo · Grupos"}));S.wcs={pts:0};S.log.unshift("🇧🇷 Convocado para a Copa do Mundo "+S.season+"!")}
else{S.pend=[{nt:1,home:20,away:o[0],lbl:"Seleção · Amistoso"}];S.log.unshift("🇧🇷 Convocado para um amistoso da Seleção!")}}
function ntRes(a,b,w){let e=S.pend.shift(),W=S.wcs;if(!e.wc)return;
if(e.g){W.pts+=a>b?3:a==b?1:0;if(!S.pend.length){if(W.pts>=4)S.pend.push(ko(0));else W.res="Eliminado na fase de grupos"}}
else if(w==20){if(e.ph==3)W.res="Campeão do Mundo 🏆";else S.pend.push(ko(e.ph+1))}
else W.res=e.ph==3?"Vice-campeão do Mundo":"Eliminado nas "+CUP[e.ph];
if(W.res)S.sel.wc.push(S.season+": "+W.res)}
function simCup(my){let c=S.cup,w=[];pairs().forEach(([a,b])=>{let x,y,win;
if(my&&(a==S.team||b==S.team)){[x,y,win]=my}else{[x,y]=sim(a,b);win=x>y?a:y>x?b:pen(a,b)}
c.log.push(`${CUP[c.ph]}: ${TEAMS[a][0]} ${x}x${y} ${TEAMS[b][0]}`);w.push(win);
if((a==S.team||b==S.team)){if(win!=S.team)c.res=c.ph==3?"Vice-campeão da Copa do Brasil":"Eliminado nas "+CUP[c.ph];else if(c.ph==3)c.res="Campeão da Copa do Brasil 🏆";else c.res="Ainda na disputa"}});
c.alive=w;c.ph++;c.pairs=null}
function play(){let e=nextEv();if(e.end)return endSeason();
let me=e.nt?20:S.team,opp=e.home==me?e.away:e.home;let n=6,lo=3,sk=null;if(S.inj)sk="🤕 Lesionado ("+S.inj.t+"): você ficou fora do jogo";else if(!e.nt){let rc=S.st.rs.length?avg(S.st.rs.slice(-3)):6.5,bp=Math.max(.03,Math.min(.6,.08+(TEAMS[S.team][1]-S.ovr)*.012-(rc-6.5)*.05));if(Math.random()<bp){if(Math.random()<.5)sk="🪑 Você ficou no banco e não entrou";else{n=3;lo=60}}}
M={e,me,opp,home:e.home==me,n,i:0,g:0,a:0,sc:0,f:0,mins:Array.from({length:n},()=>R(lo,90)).sort((a,b)=>a-b),fd:[],sub:n<6};if(sk){M.skip=sk;fin();return}mv()}
function mv(){let t=TEAMS[M.me],o=TEAMS[M.opp];
$("nv").innerHTML="";
$("app").innerHTML=`<div class="card"><div class="row sp"><b>${t[0]}</b><span class="mu">${M.e.lbl||(M.e.cup?"Copa do Brasil":"Rodada "+(S.r+1))}</span><b>${o[0]}</b></div>
<div class="mu" style="text-align:center;margin-top:6px">${M.e.nt?"Seleção Brasileira":M.home?"Em casa":"Fora de casa"} · ⚽ ${M.g} · 🎯 ${M.a}${M.sub?"<br>🪑 Entrou no 2º tempo":""}</div></div>
<div class="card"><div class="mu">Lance ${M.i+1}/${M.n} · ${M.mins[M.i]}'</div><div class="big" style="margin:8px 0">${SIT[R(0,4)]}</div>
<button class="p" onclick="act(0)">⚽ Chutar</button><button onclick="act(1)">🎯 Passar</button><button onclick="act(2)">💨 Driblar</button></div>
<div class="card">${M.fd.slice().reverse().map(x=>`<div class="log">${x}</div>`).join("")||'<span class="mu">Escolha sua jogada…</span>'}</div>`}
function act(k){let o=(S.ovr-60)/100-(TEAMS[M.opp][1]-70)*.004,m,r=Math.random;
if(k==0){if(r()<(S.pos=="ATA"?.2:.11)+o*.5){M.g++;m="⚽ GOOOL!"}else{M.f++;m="Chutou, mas o goleiro defendeu."}}
else if(k==1){if(r()<(S.pos=="MEI"?.4:.3)+o*.4){M.a++;m="🎯 Passe perfeito e gol do seu time!"}else if(r()<.6){M.sc++;m="Bom passe, finalização fraca."}else{M.f++;m="Passe interceptado."}}
else{if(r()<.5+o*.4){if(r()<.25+o){M.g++;m="⚽ Driblou e marcou!"}else{M.sc++;m="Driblou bem e a jogada seguiu."}}else{M.f++;m="Perdeu a bola no drible."}}
M.fd.push(M.mins[M.i]+"' "+m);M.i++;if(M.i<M.n&&Math.random()<.008){M.hurt=1;M.fd.push("🤕 Lesão! Você precisa sair de campo.");M.i=M.n}M.i>=M.n?fin():mv()}
function fin(){let me=M.me,op=M.opp,h=M.home,rt=Math.min(10,Math.max(4,6+M.g*1.1+M.a*.7+M.sc*.15-M.f*.2+(Math.random()-.5)*.6));rt=Math.round(rt*10)/10;
let mine=pois(lam(me,op,h)*.8)+M.g+M.a,th=pois(lam(op,me,!h)),win=null,txt="";
let x=h?mine:th,y=h?th:mine;
if(M.e.nt){win=mine>th?me:th>mine?op:pen(me,op);if(mine==th&&!M.e.g)txt=`Pênaltis: ${win==me?"o Brasil avançou!":"o Brasil caiu."}`;ntRes(mine,th,win)}else if(M.e.lib){let kk=S.lib.lp>=3;win=mine>th?me:th>mine?op:kk?pen(me,op):0;if(mine==th&&kk)txt=`Pênaltis: ${win==me?"você avançou!":"você caiu."}`;libRes([x,y,win])}else if(M.e.cup){win=mine>th?me:th>mine?op:pen(me,op);if(mine==th)txt=`Pênaltis: ${win==me?"você avançou!":"você caiu."}`;simCup([x,y,win])}
else{S.fix[S.r].forEach(([a,b])=>{if(a==me||b==me)app(a,b,x,y);else{let[s,t]=sim(a,b);app(a,b,s,t)}});S.r++}
let st=S.st;if(M.skip){}else if(M.e.nt){S.sel.caps++;S.sel.g+=M.g;S.sel.a+=M.a}else{st.apps++;st.g+=M.g;st.a+=M.a;st.rs.push(rt);S.tot.apps++;S.tot.g+=M.g;S.tot.a+=M.a}
if(M.skip&&S.inj){if(--S.inj.n<=0){S.log.unshift("💪 Você se recuperou da lesão!");S.inj=null}}else if(M.hurt)M.ij=hurt();let hn=h?TEAMS[me][0]:TEAMS[op][0],an=h?TEAMS[op][0]:TEAMS[me][0];
S.log.unshift(`${M.e.lbl||(M.e.cup?"Copa":"R"+S.r)}: ${hn} ${x}x${y} ${an} · ${M.skip||"nota "+rt+" · "+M.g+"G "+M.a+"A"}`);S.log=S.log.slice(0,15);
if(!M.e.cup&&!M.e.nt&&!M.e.lib){if(S.r===19)mkOffers();if(S.r===12||S.r===30)callUp(0)}
save();
$("app").innerHTML=`<div class="card" style="text-align:center"><h3>Fim de jogo</h3><div class="big">${hn} ${x} x ${y} ${an}</div><div class="mu">${txt}</div>
${M.skip?`<div style="margin-top:12px">${M.skip}</div>`:`<div style="margin-top:12px">Sua nota</div><div class="big" style="font-size:44px;color:var(--ac)">${rt}</div><div>⚽ ${M.g} gols · 🎯 ${M.a} assistências</div>`}${M.ij?`<p style="color:#ff8a80">🤕 Lesão: ${M.ij.t} · desfalque de ${M.ij.n} jogo(s)</p>`:""}</div><button class="p" onclick="after()">Continuar</button>`}
function after(){S.offers?offersV():go("home")}
function mkOffers(){let s=S.st;if(s.apps<4)return;let a=avg(s.rs);if(a<6.5)return;let n=a>=7.5?3:a>=7?2:1,lim=S.ovr+6+(a-6.5)*12;
let c=sh([...Array(20).keys()]).filter(i=>i!=S.team&&TEAMS[i][1]<=lim&&TEAMS[i][1]>=TEAMS[S.team][1]-2).slice(0,n);S.offers=c.length?c:null}
function offersV(back){let end=S.sum;$("nv").innerHTML="";
$("app").innerHTML=`<h2>📨 Propostas</h2><div class="mu">Seu desempenho chamou atenção!</div>`+S.offers.map(i=>`<div class="card"><div class="row"><span class="badge" style="background:${TEAMS[i][2]}"></span><b>${TEAMS[i][0]}</b></div><div class="mu">Contrato de 3 anos · R$ ${(TEAMS[i][1]-55)*40+20} mil/mês</div><button class="p" onclick="acc(${i})">Aceitar</button></div>`).join("")+`<button onclick="S.offers=null;save();go('${end?"sum":"home"}')">Recusar todas</button>`}
function acc(i){S.log.unshift(`Transferência: ${TEAMS[S.team][0]} → ${TEAMS[i][0]}`);S.team=i;S.offers=null;save();go(S.sum?"sum":"home")}
function endSeason(){if(!S.sum){let o=order(),pos=o.indexOf(S.team)+1,a=avg(S.st.rs),d=a>=7?2:a>=6.5?1:0;if(S.age<=22)d++;if(S.age>=31)d--;
let old=S.ovr;S.qual=o.slice(0,4);S.ovr=Math.max(40,Math.min(95,S.ovr+d));
S.sum={pos,old,nw:S.ovr,a,cup:S.cup.res,lib:S.lib.res,wc:S.wcs&&S.wcs.res,g:S.st.g,as:S.st.a,team:S.team};
S.hist.push({y:S.season,t:TEAMS[S.team][0],pos,g:S.st.g,a:S.st.a,n:Math.round(a*10)/10,cup:S.cup.res,lib:S.lib.res});mkOffers();save()}
S.offers?offersV():go("sum")}
function sumV(){let s=S.sum;$("nv").innerHTML="";
$("app").innerHTML=`<h2>🏁 Fim da temporada ${S.season}</h2><div class="card"><div class="big">${s.pos}º lugar ${s.pos==1?"🏆":""}</div><div class="mu">${TEAMS[s.team][0]} · Brasileirão Série A</div><p>Copa do Brasil: <b>${s.cup}</b></p>${s.lib&&s.lib!="Não classificado"?`<p>🌎 Libertadores: <b>${s.lib}</b></p>`:""}${s.wc?`<p>🇧🇷 Copa do Mundo: <b>${s.wc}</b></p>`:""}
<p>⚽ ${s.g} gols · 🎯 ${s.as} assist. · nota média ${(Math.round(s.a*10)/10)||"-"}</p><p>Overall: ${s.old} → <b style="color:var(--ac)">${s.nw}</b></p></div>${S.age>=40?`<div class="card">🏁 Aos 41 anos você encerra a carreira.</div><button class="p" onclick="retire()">Encerrar carreira</button>`:`<button class="p" onclick="S.season++;S.age++;newSeason();save();go('home')">Próxima temporada</button><button onclick="if(confirm('Se aposentar agora?'))retire()">🏁 Aposentar-se agora</button>`}`}
function go(t){tab=t;if(t=="sum")return sumV();if(t=="ret")return retV();if(t=="setup")return setup();
$("nv").innerHTML=`<nav>${[["home","🏠 Início"],["tab","📊 Tabela"],["cup","🏆 Copa"],["lib","🌎 Liberta"],["car","👤 Carreira"]].map(([k,n])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}</nav>`;
let c=TEAMS[S.team],h="";
if(t=="home"){let e=nextEv(),nx;
if(e.end)nx=`<h3>Temporada encerrada</h3><button class="p" onclick="play()">Ver resumo da temporada</button>`;
else{let me=e.nt?20:S.team,o=e.home==me?e.away:e.home;nx=`<h3>${e.lbl||(e.cup?"Copa do Brasil · "+CUP[S.cup.ph]:"Rodada "+(S.r+1)+" de 38")}</h3><div class="big">${TEAMS[e.home][0]} x ${TEAMS[e.away][0]}</div><div class="mu">${e.nt?"🇧🇷 Convocação":e.home==S.team?"Em casa":"Fora de casa"} · força do rival ${TEAMS[o][1]}</div><button class="p" onclick="play()">${S.inj?"⏩ Seguir (você está lesionado)":"⚽ Jogar partida"}</button>`}
h=`<div class="card row">${av(S.L,70,c[2],c[3])}<div><div class="big">${S.name}</div><div>${TEAMS[S.team][0]} · ${S.pos}</div><div class="mu">${S.age} anos · Overall ${S.ovr} · ${S.season}</div>${S.age>=40?'<div class="mu">⏳ Última temporada da carreira</div>':""}${S.inj?`<div style="color:#ff8a80">🤕 ${S.inj.t} · ${S.inj.n} jogo(s) fora</div>`:""}</div></div><div class="card">${nx}</div>
<div class="card"><h3>Últimos jogos</h3>${S.log.slice(0,6).map(x=>`<div class="log">${x}</div>`).join("")}</div>`}
if(t=="tab"){let o=order();h=`<div class="card"><h2>Brasileirão Série A ${S.season}</h2><table><tr><th>#</th><th>Time</th><th>P</th><th>J</th><th>V</th><th>SG</th></tr>${o.map((i,k)=>{let T=S.T[i];return`<tr class="${i==S.team?"me":""}"><td>${k+1}</td><td><span class="badge" style="background:${TEAMS[i][2]}"></span>${TEAMS[i][0]}</td><td>${T.p}</td><td>${T.j}</td><td>${T.v}</td><td>${T.gp-T.gc}</td></tr>`}).join("")}</table></div>`}
if(t=="cup"){let cp=S.cup;h=`<div class="card"><h2>Copa do Brasil</h2><p>Fase: <b>${cp.ph<4?CUP[cp.ph]:"Encerrada"}</b></p><p>Sua campanha: <b>${cp.res}</b></p><div class="mu">Mata-mata em jogo único (pênaltis em caso de empate)</div></div>
${cp.alive.length>1?`<div class="card"><h3>Times vivos</h3>${cp.alive.map(i=>`<div class="log"><span class="badge" style="background:${TEAMS[i][2]}"></span>${TEAMS[i][0]}</div>`).join("")}</div>`:""}
<div class="card"><h3>Resultados</h3>${cp.log.slice().reverse().map(x=>`<div class="log">${x}</div>`).join("")||'<span class="mu">Nenhum jogo ainda</span>'}</div>`}
if(t=="lib"){let b=S.lib;h=`<div class="card"><h2>Libertadores ${S.season}</h2><p>Sua campanha: <b>${b.res}</b></p><div class="mu">Brasileiros: ${b.q.map(i=>TEAMS[i][0]).join(", ")} (top 4 da temporada anterior)</div></div>`+b.g.map((g,k)=>`<div class="card"><h3>Grupo ${"ABCD"[k]}</h3><table><tr><th></th><th>Time</th><th>P</th><th>SG</th></tr>${g.slice().sort(gs(b)).map(i=>`<tr class="${i==S.team?"me":""}"><td></td><td><span class="badge" style="background:${TEAMS[i][2]}"></span>${TEAMS[i][0]}</td><td>${b.P[i].p}</td><td>${b.P[i].gd}</td></tr>`).join("")}</table></div>`).join("")+`<div class="card"><h3>Resultados</h3>${b.log.slice().reverse().slice(0,16).map(x=>`<div class="log">${x}</div>`).join("")||'<span class="mu">Nenhum jogo ainda</span>'}</div>`}
if(t=="car"){let s=S.st;h=`<div class="card"><h2>Carreira de ${S.name}</h2><p>Jogos: ${S.tot.apps} · Gols: ${S.tot.g} · Assist.: ${S.tot.a}</p><p class="mu">Temporada atual: ${s.apps} jogos, ${s.g} gols, ${s.a} assist., nota média ${s.rs.length?(Math.round(avg(s.rs)*10)/10):"-"}</p></div>
<div class="card"><h3>🇧🇷 Seleção Brasileira</h3><p>${S.sel.caps} jogos · ${S.sel.g} gols · ${S.sel.a} assist.</p>${S.sel.wc.map(x=>`<div class="log">Copa do Mundo ${x}</div>`).join("")}</div><div class="card"><h3>Histórico</h3>${S.hist.map(x=>`<div class="log">${x.y} · ${x.t} · ${x.pos}º · ${x.g}G ${x.a}A · nota ${x.n}<br><span class="mu">${x.cup}</span></div>`).join("")||'<span class="mu">Sem temporadas concluídas</span>'}</div>
<button onclick="if(confirm('Se aposentar agora? A carreira será encerrada.'))retire()">🏁 Aposentar-se</button><button onclick="if(confirm('Apagar carreira e começar outra?')){S=null;try{localStorage.removeItem('cb1')}catch(e){}setup()}">Nova carreira</button>`}
$("app").innerHTML=h}
S?go(S.ret?"ret":"home"):setup();
</script></body></html>
